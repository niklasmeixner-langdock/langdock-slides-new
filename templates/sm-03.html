<!--
  SM-03 — Cover with image hero, dark nav variant
  Figma node: 1069:12590

  Variant of SM-17. Image bleeds the canvas, top divider, semi-transparent
  rounded panel softens the image, Langdock mark dead-centre. Dark nav.

  Slots:
    deck_title, page_number
    bg_image_url   1920 × 1080 hero
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-03 — Cover with image (variant)</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F1F0ED;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  .bg {
    position: absolute; inset: 0;
    background-image: url('https://placehold.co/1920x1080/333/aaa?text=COVER+IMAGE');
    background-size: cover; background-position: center;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }
  .panel {
    position: absolute; left: 50%; top: 82px;
    transform: translateX(-50%);
    width: 1864px; height: 972px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
  }
  .mark {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 400px; height: 79px;
    background-image: url('https://placehold.co/400x79/ffffff00/F3F4F5?text=LANGDOCK');
    background-size: contain; background-repeat: no-repeat;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="bg" data-slot="bg_image_url"></div>
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>
    <div class="panel"></div>
    <div class="mark"></div>
  </div>
</body>
</html>
