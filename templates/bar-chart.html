<!--
  bar-chart — data-driven bar chart archetype.

  Demonstrates the chart-primitive dispatch.  The `<div data-chart="bars">`
  block is read by the walker; its spec is JSON in `data-chart-spec` (this
  file) or in `textContent` (so an agent can pass the spec through a
  `data-slot` substitution).

  Spec shape (bars kind):
    {
      "orientation": "vertical" | "horizontal",
      "bars": [
        {
          "label":      "April 2024",      // category label
          "value":      9000,              // numeric, drives bar size
          "valueLabel": "9.000",           // optional, display label for value
          "color":      "neutral",         // accent | neutral | pastelBlue | …
          "labelColor": "muted",           // optional, defaults to muted
          "valueColor": "ink"              // optional, defaults to ink
        }
      ],
      "maxValue":  null,    // optional, else max of bars[].value
      "valueSize": 32,      // optional, value text size
      "labelSize": 18,      // optional, category label text size
      "gap":       24,      // optional, gap between bars
      "barWidth":  null,    // optional, defaults to 60% of column / row
      "barRadius": 8        // optional, corner radius
    }

  Slots:
    deck_title    — small nav-right label, e.g. "Growth"
    title         — main headline, e.g. "Vom Pilot zum täglichen Werkzeug"
    chart_spec    — (optional) JSON spec for the chart, replaces the
                    default in `data-chart-spec` via textContent.
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bar chart</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F8F8F9;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21; overflow: hidden;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .title {
    position: absolute; left: 160px; top: 180px; max-width: 1280px;
    margin: 0;
    font-size: 64px; font-weight: 300; line-height: 1.05; letter-spacing: -1.28px;
    color: #1A1C21;
  }

  .chart {
    position: absolute; left: 160px; top: 380px;
    width: 1600px; height: 540px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Growth</p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <p class="title" data-slot="title">Vom Pilot zum täglichen Werkzeug</p>

    <div class="chart" data-chart="bars" data-slot="chart_spec" data-chart-spec='{
      "orientation": "vertical",
      "bars": [
        { "label": "April 2024",  "value":  9000, "valueLabel": "9.000",  "color": "neutral" },
        { "label": "Heute",       "value": 33000, "valueLabel": "33.000", "color": "accent" }
      ]
    }'></div>
  </div>
</body>
</html>
