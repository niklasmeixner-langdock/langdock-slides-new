<!--
  SM-46 — Full-bleed image + gradient + centred 96 px statement
  Figma node: 750:16228

  Use when: a strong cinematic statement cover. Full-canvas image with a
  top→bottom dark gradient (0 → 70 % black). Headline is centred at 96 px
  in light ink, max width 1314 px.

  Slots:
    deck_title, page_number
    bg_image_url        full-bleed 1920 × 1080 image
    statement_line1     ~22 chars @ 96 px (centred)
    statement_line2     ~22 chars @ 96 px
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SM-46 — Cinematic statement</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F8F8F9;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #F3F4F5; overflow: hidden;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 7%, rgba(0,0,0,0.7) 93%),
      url('https://placehold.co/1920x1080/333/aaa?text=BG') center/cover;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .statement {
    position: absolute;
    left: 50%; top: calc(50% - 54px);
    transform: translateX(-50%);
    width: 1314px;
    margin: 0;
    text-align: center;
    font-weight: 400; font-size: 96px; line-height: 1;
    letter-spacing: -1.92px; color: #F3F4F5;
  }
  .statement p { margin: 0; }
</style>
</head>
<body>
  <div class="slide">
    <div class="bg" data-slot="bg_image_url"></div>
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>
    <div class="statement">
      <p data-slot="statement_line1">Wir helfen Unternehmen,</p>
      <p data-slot="statement_line2">KI erfolgreich einzuführen.</p>
    </div>
  </div>
</body>
</html>
