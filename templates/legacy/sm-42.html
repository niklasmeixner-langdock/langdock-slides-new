<!--
  SM-42 — Right-half image cover + single-line 64 px headline (dark nav)
  Figma node: 750:16273

  Simpler version of SM-41 with one-line headline.

  Slots:
    deck_title, page_number
    bg_image_url   right 950 × 1080 image
    headline       1 line @ 64 px ink (~30 chars)
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-42 — Cover with right image (one-line headline)</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F1F0ED;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21; overflow: hidden;
  }
  .image {
    position: absolute; right: 0; top: 0;
    width: 950px; height: 1080px;
    background: url('https://placehold.co/950x1080/333/aaa?text=IMAGE') center/cover;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .headline {
    position: absolute;
    left: 40px; top: 159px;
    width: 910px;
    margin: 0;
    font-weight: 400; font-size: 64px; line-height: 1.1;
    letter-spacing: -1.28px; color: #1A1C21;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="image" data-slot="bg_image_url"></div>

    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <p class="headline" data-slot="headline">From Chatbot to general-purpose AI Agents</p>
  </div>
</body>
</html>
