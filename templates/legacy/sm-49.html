<!--
  SM-49 — Title + numbered list left, large shadowed image right
  Figma node: 750:16197

  Use when: explaining a 4-step "how it works" with an accompanying
  screenshot. Big 64 px title at the top-left, "How does it work?" eyebrow,
  and a numbered list (1-4) at 36 px. Right half: cream panel + large
  shadowed image.

  Slots:
    deck_title, page_number
    title              1–3 lines @ 64 px ink (max-width 754 px)
    list_label         e.g. "How does it work?" — 36 px ink
    steps[0..3]        1 line each @ 36 px grey (numbered ordered list)
    image_url          ~1482 × 854 screenshot
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-49 — Title + numbered steps + image</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide { position: relative; width: 1920px; height: 1080px; background: #F8F8F9; font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif; color: #1A1C21; overflow: hidden; }
  .right-block { position: absolute; right: 0; top: 0; width: 950px; height: 1080px; background: #F1F0ED; }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .left {
    position: absolute; left: 40px; top: 159px;
    width: 910px; height: 777px;
    display: flex; flex-direction: column; gap: 80px;
  }
  .title    { margin: 0; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -1.28px; color: #1A1C21; width: 754px; }
  .list-block { display: flex; flex-direction: column; gap: 24px; }
  .list-label { margin: 0; font-weight: 400; font-size: 36px; line-height: 1.1; letter-spacing: -0.72px; color: #1A1C21; }
  .steps  { margin: 0; padding-left: 54px; font-weight: 400; font-size: 36px; line-height: 1.2; letter-spacing: -0.72px; color: #78787A; }
  .steps li { margin: 0 0 4px; }

  .image {
    position: absolute; left: calc(50% + 84px); top: 50%;
    transform: translateY(-50%);
    width: 1482px; height: 854px;
    background: url('https://placehold.co/1482x854/EDEDEE/9aa0a6?text=SCREENSHOT') center/cover;
    box-shadow: 0 15px 48px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="right-block"></div>

    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <div class="left">
      <p class="title" data-slot="title">Data Analyst tool lets you analyze CSVs and Excel in Langdock</p>
      <div class="list-block">
        <p class="list-label" data-slot="list_label">How does it work?</p>
        <ol class="steps">
          <li data-slot="steps.0">Upload or link your file</li>
          <li data-slot="steps.1">Describe your task</li>
          <li data-slot="steps.2">Langdock auto generates Python code to analyse data</li>
          <li data-slot="steps.3">Results appear instantly</li>
        </ol>
      </div>
    </div>

    <div class="image" data-slot="image_url"></div>
  </div>
</body>
</html>
