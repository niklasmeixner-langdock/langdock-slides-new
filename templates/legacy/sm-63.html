<!--
  SM-63 — Product UI showcase: tab row + app mockup (Agents active)
  Figma node: 750:15469

  Variant of SM-64 with the "Agents" tab highlighted instead of "Chat".

  Slots: same as SM-64.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-63 — Product UI (Agents)</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide { position: relative; width: 1920px; height: 1080px; background: #F1F0ED; font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif; color: #1A1C21; overflow: hidden; }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; }

  .tabs-block {
    position: absolute; left: 40px; top: 80px;
    width: 1840px;
    display: flex; flex-direction: column; gap: 40px;
  }
  .tab-divider { height: 1px; background: #BEBEC2; width: 100%; }
  .tabs {
    display: flex; gap: 40px;
    font-weight: 400; font-size: 36px; line-height: 1;
    letter-spacing: -0.72px;
  }
  .tabs p { margin: 0; color: #78787A; }
  .tabs p.active { color: #1A1C21; }

  .mockup {
    position: absolute; left: 50%; top: 300px;
    transform: translateX(-50%);
    width: 1440px; height: 1075px;
    border-radius: 8.83px 8.83px 0 0;
    background:
      rgba(251, 251, 251, 0.7)
      url('https://placehold.co/1440x1075/EDEDEE/9aa0a6?text=AGENT+CONFIG+MOCKUP') center/cover;
    box-shadow: 0 15px 48px rgba(0,0,0,0.08);
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>

    <div class="tabs-block">
      <div class="tab-divider"></div>
      <div class="tabs">
        <p              data-slot="tabs.0.label">Chat</p>
        <p class="active" data-slot="tabs.1.label">Agents</p>
        <p              data-slot="tabs.2.label">Workflows</p>
        <p              data-slot="tabs.3.label">Mobile App</p>
      </div>
      <div class="tab-divider"></div>
    </div>

    <div class="mockup" data-slot="mockup_image_url"></div>
  </div>
</body>
</html>
