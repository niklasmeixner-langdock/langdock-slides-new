<!--
  SM-60 — Centred 96 px statement on cream canvas
  Figma node: 750:16093

  Big cinematic statement on plain cream — no image.

  Slots:
    deck_title, page_number
    statement_line1, statement_line2  ~22 chars each @ 96 px (centred)
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SM-60 — Centred 96 px statement</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide { position: relative; width: 1920px; height: 1080px; background: #F1F0ED; font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif; color: #1A1C21; overflow: hidden; }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .statement {
    position: absolute; left: 50%; top: calc(50% - 108px);
    transform: translateX(-50%);
    width: 1550px; text-align: center;
    font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: -1.92px;
    color: #1A1C21; margin: 0;
  }
  .statement p { margin: 0; }
</style>
</head>
<body>
  <div class="slide">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>
    <div class="statement">
      <p data-slot="statement_line1">Wir helfen Unternehmen,</p>
      <p data-slot="statement_line2">KI erfolgreich einzuführen.</p>
    </div>
  </div>
</body>
</html>
