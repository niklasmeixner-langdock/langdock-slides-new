<!--
  SM-21 — Workshop section divider: huge headline + smaller portrait (no subhead)
  Figma node: 750:19522

  Variant of SM-20 with a slightly smaller portrait (730 × 800) and no
  workshop label / date underneath the headline.

  Slots:
    deck_title, page_number
    headline_line1, headline_line2  ~14 chars each @ 130 px
    portrait_image_url              730 × 800
    speaker_name, speaker_role      24 px white on dark
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-21 — Section divider with portrait</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F1F0ED;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21; overflow: hidden;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .headline {
    position: absolute; left: 40px; top: 160px;
    width: 910px;
    font-weight: 400; font-size: 130px; line-height: 1; letter-spacing: -2.6px;
    margin: 0;
  }
  .headline p { margin: 0; }

  .portrait {
    position: absolute; right: 75px; top: 140px;
    width: 730px; height: 800px;
    border-radius: 7px; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%),
      url('https://placehold.co/730x800/333/aaa?text=SPEAKER') center/cover;
  }
  .speaker {
    position: absolute; right: 40px; bottom: 40px;
    font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: -0.48px;
    text-align: right;
  }
  .speaker .name { margin: 0 0 6px; color: #fff; }
  .speaker .role { margin: 0; color: #9F9F9D; }
</style>
</head>
<body>
  <div class="slide">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <div class="headline">
      <p data-slot="headline_line1">Intro to AI</p>
      <p data-slot="headline_line2">&amp; Basic Chat</p>
    </div>

    <div class="portrait" data-slot="portrait_image_url">
      <div class="speaker">
        <p class="name" data-slot="speaker_name">Nina Ipsum,</p>
        <p class="role" data-slot="speaker_role">Chief Marketing</p>
      </div>
    </div>
  </div>
</body>
</html>
