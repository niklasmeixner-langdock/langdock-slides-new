<!--
  SM-43 — Right-half image cover (variant of SM-41 with extra image layers)
  Figma node: 750:16264

  Slots same as SM-41.
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SM-43 — Cover with right image (variant)</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide { position: relative; width: 1920px; height: 1080px; background: #F1F0ED; font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif; color: #1A1C21; overflow: hidden; }
  .image { position: absolute; right: 0; top: 0; width: 950px; height: 1080px; background: url('https://placehold.co/950x1080/333/aaa?text=IMAGE') center/cover; }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }
  .headline { position: absolute; left: 40px; top: 159px; width: 910px; margin: 0; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -1.28px; color: #1A1C21; }
  .headline p { margin: 0; }
</style>
</head>
<body>
  <div class="slide">
    <div class="image" data-slot="bg_image_url"></div>
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>
    <div class="headline">
      <p data-slot="headline_line1">Wir helfen Unternehmen,</p>
      <p data-slot="headline_line2">KI erfolgreich einzuführen.</p>
    </div>
  </div>
</body>
</html>
