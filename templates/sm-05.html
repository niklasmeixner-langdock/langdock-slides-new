<!--
  SM-05 — Text + right-shadow image (no footnote)
  Figma node: 1069:12570

  Same anatomy as SM-04 but no bottom info block, and the canvas is the
  cool #F8F8F9 neutral instead of the warm cream.

  Slots:
    deck_title, page_number
    title       1–2 lines @ 64 px, max-width 755 px
    subtitle    1–3 lines @ 48 px grey, max-width 755 px
    image_url   1065 × 614 hero / screenshot
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-05 — Text + image (cool canvas)</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F8F8F9;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21; overflow: hidden;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left { left: 40px; } .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; } .divider.bottom { top: 1040px; }

  .text {
    position: absolute; left: 40px; top: 160px;
    width: 755px;
    display: flex; flex-direction: column; gap: 80px;
  }
  .title    { margin: 0; font-weight: 400; font-size: 64px; line-height: 1.1; letter-spacing: -1.28px; color: #1A1C21; }
  .subtitle { margin: 0; font-weight: 400; font-size: 48px; line-height: 1.1; letter-spacing: -0.96px; color: #78787A; }

  .image {
    position: absolute;
    left: calc(41.67% + 15px); top: 50%;
    transform: translateY(-50%);
    width: 1065px; height: 614px;
    background:
      url('https://placehold.co/1065x614/EDEDEE/9aa0a6?text=IMAGE') center/cover;
    box-shadow: 0 15px 48px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <div class="text">
      <p class="title"    data-slot="title">From Chatbot to general-purpose AI Agents</p>
      <p class="subtitle" data-slot="subtitle">Data Analyst tools let you analyze CSVs and Excel in Langdock</p>
    </div>

    <div class="image" data-slot="image_url"></div>
  </div>
</body>
</html>
