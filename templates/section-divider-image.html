<!--
  SM-19 — Section divider: big 130 px headline + right-half image
  Figma node: 750:19543

  Use when: opening a section/chapter. Left half carries a giant 1–2 line
  headline; right half (950 × 1080) is an image bleed.

  Slots:
    deck_title       1 line @ 12.8 px — ~32 chars
    page_number      "P. N"
    headline_line1   ~14 chars @ 130 px (e.g. "Intro to AI")
    headline_line2   ~14 chars @ 130 px (e.g. "& Basic Chat")
    bg_image_url     right-half image (950 × 1080)
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-19 — Section divider with image</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #F1F0ED;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21;
    overflow: hidden;
  }
  .nav-left, .nav-right {
    position: absolute; top: 30px;
    color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400;
  }
  .nav-left  { left: 40px; }
  .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider {
    position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2;
  }
  .divider.top { top: 104px; }
  .divider.bottom { top: 1040px; }

  .image {
    position: absolute; right: 0; top: 0;
    width: 950px; height: 1080px;
    background-image: url('https://placehold.co/950x1080/333/aaa?text=SECTION+IMAGE');
    background-size: cover; background-position: center;
  }

  .headline {
    position: absolute; left: 40px; top: 160px;
    width: 910px;
    font-weight: 400; font-size: 130px; line-height: 1.0;
    letter-spacing: -2.6px;
    margin: 0;
  }
  .headline p { margin: 0; }
</style>
</head>
<body>
  <div class="slide">
    <div class="image" data-slot="bg_image_url"></div>

    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <div class="headline">
      <p data-slot="headline_line1">Intro to AI</p>
      <p data-slot="headline_line2">&amp; Basic Chat</p>
    </div>
  </div>
</body>
</html>
