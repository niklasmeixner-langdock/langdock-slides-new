<!--
  SM-18 — Section divider, color-flooded background
  Figma node: 750:19551

  Use when: simplest possible chapter divider. Whole canvas is a single
  pastel/brand color; just a 2-line 130 px headline and nav. No image.

  Default bg #DBE8E6 (sage). Swap to any pastel from the styleguide:
    #F0EBE3 beige · #D4DDD6 sage · #D5D0E5 lavender · #E3E0DB warm grey
    #1F2024 dark (use light text variant)

  Slots:
    deck_title         1 line @ 12.8 px
    page_number        "P. N"
    bg_color           hex of the flood color
    headline_line1     ~14 chars @ 130 px
    headline_line2     ~14 chars @ 130 px
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SM-18 — Section divider, flood</title>
<style>
  html, body { margin: 0; background: #2a2a2a; }
  .slide {
    position: relative; width: 1920px; height: 1080px;
    background: #DBE8E6;
    font-family: 'STK Bureau Sans', 'Inter', system-ui, sans-serif;
    color: #1A1C21;
    overflow: hidden;
  }
  .nav-left, .nav-right { position: absolute; top: 30px; color: #78787A; font-size: 12.8px; line-height: 15px; font-weight: 400; }
  .nav-left  { left: 40px; }
  .nav-right { left: 195px; }
  .nav-right p { margin: 0; }
  .divider { position: absolute; left: 40px; width: 1840px; height: 1px; background: #BEBEC2; }
  .divider.top { top: 104px; }
  .divider.bottom { top: 1040px; }

  .headline {
    position: absolute; left: 40px; top: 144px;
    width: 910px;
    font-weight: 400; font-size: 130px; line-height: 1;
    letter-spacing: -2.6px;
    color: #1A1C21;
    margin: 0;
  }
  .headline p { margin: 0; }
</style>
</head>
<body>
  <div class="slide" data-slot="bg_color">
    <div class="nav-left">Langdock</div>
    <div class="nav-right">
      <p data-slot="deck_title">Advanced Tools</p>
      <p>P. <span data-slot="page_number">1</span></p>
    </div>
    <div class="divider top"></div>
    <div class="divider bottom"></div>

    <div class="headline">
      <p data-slot="headline_line1">New Section</p>
      <p data-slot="headline_line2">Divider</p>
    </div>
  </div>
</body>
</html>
